{
  "configuration": {
    "ha_url": {
      "name": "Home Assistant URL",
      "description": "The URL of the Home Assistant frontend or core instance to display."
    },
    "ha_dashboard": {
      "name": "Dashboard Path",
      "description": "Optional specific Lovelace dashboard path."
    },
    "browser_refresh": {
      "name": "Browser Refresh Interval",
      "description": "Time in seconds before refreshing the browser."
    },
    "ha_sidebar": {
      "name": "Sidebar Visibility",
      "description": "Configure visibility of the Home Assistant sidebar."
    },
    "ha_theme": {
      "name": "Theme Override",
      "description": "Force a specific theme name."
    },
    "dark_mode": {
      "name": "Dark Mode",
      "description": "Enable or disable dark mode preference."
    },
    "screen_timeout": {
      "name": "Screen Timeout",
      "description": "Seconds of inactivity before blanking the display."
    },
    "rotate_display": {
      "name": "Rotate Display",
      "description": "Screen orientation (normal, right, inverted, left)."
    },
    "login_delay": {
      "name": "Login Delay",
      "description": "Delay in seconds before attempting automated interactions."
    },
    "ignore_certificate_errors": {
      "name": "Legacy certificate bypass (ignored)",
      "description": "Deprecated. Use Trust a self-signed certificate and supply its public certificate instead."
    },
    "auth_method": {
      "name": "Authentication Method",
      "description": "Choose trusted networks, username/password automation, or no automatic authentication."
    },
    "ha_username": {
      "name": "Home Assistant Username",
      "description": "Username used only when Authentication Method is set to credentials."
    },
    "ha_password": {
      "name": "Home Assistant Password",
      "description": "Password used only when Authentication Method is set to credentials."
    },
    "api_token": {
      "name": "Kiosk Control API Token",
      "description": "At least 32 non-whitespace characters when the control API is enabled. Use this app-local secret in automation Bearer headers; it is not a Home Assistant access token."
    },
    "time_zone": {
      "name": "Time zone",
      "description": "IANA time zone for the kiosk browser. Defaults to America/Chicago (US Central with automatic daylight saving time). Leave empty to inherit the system time zone. Restart the app after changing."
    },
    "allow_http": {
      "name": "Allow HTTP",
      "description": "Allow local Home Assistant URLs without HTTPS. Enabled by default. Disable to require HTTPS."
    },
    "allow_self_signed": {
      "name": "Trust a self-signed certificate",
      "description": "Trust the public PEM certificate below. Hostname and expiry checks remain enabled. Restart after changing."
    },
    "self_signed_certificate": {
      "name": "Trusted certificate (PEM)",
      "description": "Paste one public certificate or local CA certificate, including BEGIN/END CERTIFICATE lines. Never paste a private key."
    },
    "audio_enabled": {
      "name": "Enable audio",
      "description": "Enable dashboard playback. Disable to mute the browser and disconnect it from PulseAudio. Restart after changing."
    },
    "control_api_enabled": {
      "name": "Enable control API",
      "description": "Allow authenticated Home Assistant automations over the internal app network. Requires an API token of at least 32 characters."
    },
    "gpu_devices": {
      "name": "GPU devices",
      "description": "Select the DRM card and render node for this display. Usually card0 and renderD128."
    },
    "input_devices": {
      "name": "Touchscreen and input devices",
      "description": "Select the touchscreen and pointer event devices from Settings > System > Hardware. Other input devices are not granted access."
    }
  }
}
