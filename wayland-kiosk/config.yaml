name: "HAOS Wayland Kiosk"
description: "Wayland-native kiosk dashboard using Cage and Chromium"
version: "2026.08.20.5"
slug: "app_kiosk"
init: false
startup: application
url: "https://github.com/trooperthorn/ha_app_kiosk/"

# --- Network and API Access ---
# host_network is required so that ha_url: http://127.0.0.1:8123 reaches the
# real Home Assistant Core instance (with host_network off, 127.0.0.1 would
# just be the container's own loopback). It's also what makes the
# trusted_networks auth provider trivially trust this add-on's requests.
host_network: true
hassio_api: true

arch:
  - aarch64
  - amd64

# --- Hardware and System Access ---
# Minimum permissions: explicit device passthrough instead of full_access.
# full_access: true (previous config) granted access to every device on the
# host, which is far more than this add-on needs. Only /dev/dri (GPU/DRM)
# and /dev/input (touch/keyboard) are actually required.
#
# FORMAT MATTERS: each entry must be a single, individual device-node path.
# Supervisor looks every entry up in its udev hardware database and grants
# access via a cgroup device rule (docker/app.py cgroups_rules); anything it
# can't find there -- a directory like /dev/dri, or the old Docker-style
# "/dev/dri:/dev/dri:rwm" triplet this file used to contain -- is SILENTLY
# skipped (debug-level log only). The add-on then starts with zero device
# grants: the nodes are still visible in /dev, but open() fails with EPERM
# ("Operation not permitted") from the cgroup v2 device filter, and Cage
# dies with "Found 0 GPUs". Nodes listed here that don't exist on a given
# host are skipped harmlessly, so over-listing is safe.
udev: true
audio: true
devices:
  - /dev/dri/card0
  - /dev/dri/card1
  - /dev/dri/renderD128
  - /dev/dri/renderD129
  - /dev/input/event0
  - /dev/input/event1
  - /dev/input/event2
  - /dev/input/event3
  - /dev/input/event4
  - /dev/input/event5
  - /dev/input/event6
  - /dev/input/event7
  - /dev/input/event8
  - /dev/input/event9
  - /dev/input/event10
  - /dev/input/event11
  - /dev/input/event12
  - /dev/input/event13
  - /dev/input/event14
  - /dev/input/event15
  - /dev/input/event16
  - /dev/input/event17
  - /dev/input/event18
  - /dev/input/event19
  - /dev/input/event20
  - /dev/input/event21
  - /dev/input/event22
  - /dev/input/event23
  - /dev/input/event24
  - /dev/input/event25

# NOTE: do NOT set `apparmor: false` here. It was once tried as a fix for
# the /dev/dri "Operation not permitted" crash and did nothing (the real
# cause was the malformed `devices:` entries described above); it only
# strips the add-on's security confinement for no benefit.

# --- Storage and Limits ---
map:
  - addon_config:rw
  - media:rw

ulimits:
  nofile:
    soft: 65536
    hard: 65536

# --- Default User Configuration ---
options:
  ha_url: "http://127.0.0.1:8123"
  ha_dashboard: "lovelace"
  browser_refresh: 12000
  ha_sidebar: "none"
  ha_theme: ""
  dark_mode: true
  screen_timeout: 0
  rotate_display: "right"
  login_delay: 10
  ignore_certificate_errors: true
  # Auth options (new)
  auth_method: "trusted_networks"
  ha_username: ""
  ha_password: ""
  # Shared secret required by rest_server.py's control API. Leave blank to
  # disable the check (not recommended) -- see rest_server.py comments.
  api_token: ""

# --- Enforced UI Schema ---
schema:
  ha_url: url
  ha_dashboard: str?
  browser_refresh: int(0,)
  ha_sidebar: list(full|narrow|none)
  ha_theme: str?
  dark_mode: bool
  screen_timeout: int(0,)
  rotate_display: list(normal|left|right|inverted)
  ignore_certificate_errors: bool
  login_delay: float(0,)
  auth_method: list(trusted_networks|credentials|none)
  ha_username: str?
  ha_password: password?
  api_token: str?
