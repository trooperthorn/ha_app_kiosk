name: "HAOS Wayland Kiosk"
description: "Wayland-native kiosk dashboard using Cage and Chromium"
version: "2026.08.20.1"
slug: "app_kiosk"
init: false
startup: application
url: "https://github.com/trooperthorn/ha_app_kiosk/"

# --- Network and API Access ---
# host_network is required so that ha_url: http://127.0.0.1:8123 reaches the
# real Home Assistant Core instance (with host_network off, 127.0.0.1 would
# just be the container's own loopback). It's also what makes the
# trusted_networks auth provider trivially trust this add-on's requests.
host_network: true
hassio_api: true

arch:
  - aarch64
  - amd64

# --- Hardware and System Access ---
# Minimum permissions: explicit device passthrough instead of full_access.
# full_access: true (previous config) granted access to every device on the
# host, which is far more than this add-on needs. Only /dev/dri (GPU/DRM)
# and /dev/input (touch/keyboard) are actually required.
udev: true
audio: true
devices:
  - /dev/dri:/dev/dri:rwm
  - /dev/input:/dev/input:rwm

# AppArmor confinement (the Supervisor's default profile applied to any
# add-on that doesn't ship its own apparmor.txt) does not allow writing
# under /etc/udev/rules.d/ or issuing the udevadm control/trigger calls
# run.sh needs for touch-rotation calibration. Under confinement those
# calls fail with Permission denied -- and because run.sh runs under
# bashio's errexit, that failure previously killed the whole script before
# Cage/Chromium ever started (the "app fails to load" symptom). udev: true
# above only grants access to the device nodes/events themselves, not to
# writing rule files, so it does not cover this. Disabling AppArmor for
# this add-on is required for the udev-based touch calibration to work;
# run.sh also now treats a failed rule write as non-fatal so the kiosk
# display still starts even if this is ever re-enabled.
apparmor: false

# --- Storage and Limits ---
map:
  - addon_config:rw
  - media:rw

ulimits:
  nofile:
    soft: 65536
    hard: 65536

# --- Default User Configuration ---
options:
  ha_url: "http://127.0.0.1:8123"
  ha_dashboard: "lovelace"
  browser_refresh: 12000
  ha_sidebar: "none"
  ha_theme: ""
  dark_mode: true
  screen_timeout: 0
  rotate_display: "right"
  login_delay: 10
  ignore_certificate_errors: true
  # Auth options (new)
  auth_method: "trusted_networks"
  ha_username: ""
  ha_password: ""
  # Shared secret required by rest_server.py's control API. Leave blank to
  # disable the check (not recommended) -- see rest_server.py comments.
  api_token: ""

# --- Enforced UI Schema ---
schema:
  ha_url: url
  ha_dashboard: str?
  browser_refresh: int(0,)
  ha_sidebar: list(full|narrow|none)
  ha_theme: str?
  dark_mode: bool
  screen_timeout: int(0,)
  rotate_display: list(normal|left|right|inverted)
  ignore_certificate_errors: bool
  login_delay: float(0,)
  auth_method: list(trusted_networks|credentials|none)
  ha_username: str?
  ha_password: password?
  api_token: str?
