name: "HAOS Wayland Kiosk"
description: "Wayland-native kiosk dashboard using Cage and Chromium"
version: "2026.09.03.1"
slug: "app_kiosk"
init: false
startup: application
url: "https://github.com/trooperthorn/ha_app_kiosk/"

# host_network is required for ha_url: http://127.0.0.1:8123 to reach the
# real Core instance; see docs/security.md.
host_network: true

arch:
  - aarch64
  - amd64

# Explicit device-node passthrough, not full_access; entries must be
# individual nodes, not directories. See docs/security.md and
# docs/operations.md.
udev: true
audio: true
devices:
  - /dev/dri/card0
  - /dev/dri/card1
  - /dev/dri/renderD128
  - /dev/dri/renderD129
  - /dev/input/event0
  - /dev/input/event1
  - /dev/input/event2
  - /dev/input/event3
  - /dev/input/event4
  - /dev/input/event5
  - /dev/input/event6
  - /dev/input/event7
  - /dev/input/event8
  - /dev/input/event9
  - /dev/input/event10
  - /dev/input/event11
  - /dev/input/event12
  - /dev/input/event13
  - /dev/input/event14
  - /dev/input/event15
  - /dev/input/event16
  - /dev/input/event17
  - /dev/input/event18
  - /dev/input/event19
  - /dev/input/event20
  - /dev/input/event21
  - /dev/input/event22
  - /dev/input/event23
  - /dev/input/event24
  - /dev/input/event25

# Do NOT set apparmor: false; see docs/decisions.md.

map:
  - addon_config:rw
  - media:rw

ulimits:
  nofile:
    soft: 65536
    hard: 65536

options:
  ha_url: "http://127.0.0.1:8123"
  ha_dashboard: "lovelace"
  browser_refresh: 12000
  ha_sidebar: "none"
  ha_theme: ""
  dark_mode: true
  screen_timeout: 0
  rotate_display: "right"
  login_delay: 10
  ignore_certificate_errors: true
  auth_method: "trusted_networks"
  ha_username: ""
  ha_password: ""
  # App-local shared secret for the control API; not a HA long-lived
  # access token. See docs/security.md.
  api_token: ""

schema:
  ha_url: url
  ha_dashboard: str?
  browser_refresh: int(0,)
  ha_sidebar: list(full|narrow|none)
  ha_theme: str?
  dark_mode: bool
  screen_timeout: int(0,)
  rotate_display: list(normal|left|right|inverted)
  ignore_certificate_errors: bool
  login_delay: float(0,)
  auth_method: list(trusted_networks|credentials|none)
  ha_username: str?
  ha_password: password?
  api_token: password?
