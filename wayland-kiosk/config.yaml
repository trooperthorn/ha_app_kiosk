name: "HAOS Wayland Kiosk"
description: "Wayland-native kiosk dashboard using Cage and Chromium"
version: "2026.09.12.2"
breaking_versions:
  - "2026.09.11.2"
slug: "app_kiosk"
init: false
startup: application
url: "https://github.com/trooperthorn/ha_app_kiosk/"

# Core and automations communicate over the Supervisor bridge network.
host_network: false
apparmor: true

arch:
  - aarch64
  - amd64

# Explicit device-node passthrough, not full_access; entries must be
# individual nodes, not directories. See docs/security.md and
# docs/operations.md.
udev: true
audio: true
# Device access comes only from the selected device options below.
# /data is provided by Supervisor; no shared writable mounts are needed.

ulimits:
  nofile:
    soft: 65536
    hard: 65536

options:
  ha_url: "http://homeassistant:8123"
  allow_http: true
  allow_self_signed: false
  self_signed_certificate: ""
  audio_enabled: true
  debug_logging: false
  control_api_enabled: false
  gpu_devices:
    - /dev/dri/card0
    - /dev/dri/renderD128
  input_devices: []
  ha_dashboard: "lovelace"
  browser_refresh: 12000
  lock_navigation: true
  return_to_dashboard: 0
  ha_sidebar: "none"
  ha_theme: ""
  time_zone: "America/Chicago"
  dark_mode: true
  screen_timeout: 0
  rotate_display: "right"
  login_delay: 10
  auth_method: "none"
  ha_username: ""
  ha_password: ""
  # App-local shared secret for the control API; not a HA long-lived
  # access token. See docs/security.md.
  api_token: ""

schema:
  ha_url: url
  allow_http: bool
  allow_self_signed: bool
  self_signed_certificate: str?
  audio_enabled: bool
  debug_logging: bool
  control_api_enabled: bool
  gpu_devices:
    - device(subsystem=drm)
  input_devices:
    - device(subsystem=input)
  ha_dashboard: str?
  browser_refresh: int(0,)
  lock_navigation: bool
  return_to_dashboard: int(0,)
  ha_sidebar: list(full|narrow|none)
  ha_theme: str?
  time_zone: str?
  dark_mode: bool
  screen_timeout: int(0,)
  rotate_display: list(normal|left|right|inverted)
  ignore_certificate_errors: bool?
  login_delay: float(0,)
  auth_method: list(trusted_networks|credentials|none)
  ha_username: str?
  ha_password: password?
  api_token: password?
