name: "HAOS Wayland Kiosk"
description: "Wayland-native kiosk dashboard using Cage and Chromium"
version: "1.1"
slug: "haos_wayland_kiosk"
init: false
startup: application

url: "https://github.com/trooperthorn/HA-Kiosk"
host_dbus: true

# Network and API Access
host_network: true
ingress: true
hassio_api: true
homeassistant_api: true
auth_api: true

arch:
  - aarch64
  - amd64
  - armv7

# Hardware and System Access
video: true
udev: true
audio: true
usb: true
full_access: true

# Storage and Limits
map:
  - addon_config:rw
  - media:rw
  
#privileged:
#  - SYS_ADMIN
#devices:
#  - /dev/input:/dev/input
#  - /dev/dri:/dev/dri

# Storage and Limits
map:
  - addon_config:rw
  - media:rw
ulimits:
  nofile:
    soft: 65536
    hard: 65536


# Default User Configuration
options:
  ha_url: "http://127.0.0.1:8123"
  ha_dashboard: "lovelace"
  browser_refresh: 12000
  ha_sidebar: "none"
  ha_theme: ""
  dark_mode: true
  screen_timeout: 0
  rotate_display: "right"
  login_delay: 10
  ignore_certificate_errors: true
  auth_method: "trusted_networks"
  ha_username: ""
  ha_password: ""

schema:
  ha_url: url
  ha_dashboard: str?
  browser_refresh: int(0,)
  ha_sidebar: list(full|narrow|none)
  ha_theme: str?
  dark_mode: bool
  screen_timeout: int(0,)
  rotate_display: list(normal|left|right|inverted)
  ignore_certificate_errors: bool
  login_delay: float(0,)
  auth_method: list(trusted_networks|credentials|none)
  ha_username: str?
  ha_password: password?
