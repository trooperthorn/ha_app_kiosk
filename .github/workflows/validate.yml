# App config and Dockerfile validation; apps are not distributed through HACS, so no hacs or hassfest job.
name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  app-config:
    name: App config well-formed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Validate YAML
        run: |
          pip install pyyaml
          python -c "
          import yaml
          for f in ['wayland-kiosk/config.yaml', 'repository.yaml', 'display-kiosk.yaml']:
              with open(f, encoding='utf-8') as fh:
                  yaml.safe_load(fh)
              print(f, 'OK')
          "

  hadolint:
    name: Dockerfile lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Only genuine errors block; see docs/operations.md "CI gate thresholds".
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: wayland-kiosk/Dockerfile
          failure-threshold: error
