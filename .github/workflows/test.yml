# Syntax, lint, and image build gate; release.yml calls it so the same checks gate every release.
name: Test

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: Syntax and lint (Python 3.14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Compile Python
        run: python -m compileall -q wayland-kiosk
      - name: Install test dependencies
        run: pip install aiohttp==3.14.3
      - name: Security and time zone regression tests
        run: python -m unittest discover -s tests -v
      - name: Shell syntax check
        run: |
          bash -n wayland-kiosk/run.sh
          bash -n wayland-kiosk/launch-browser.sh
      - name: Validate YAML
        run: |
          pip install pyyaml
          python -c "
          import yaml
          for f in ['wayland-kiosk/config.yaml', 'repository.yaml', 'display-kiosk.yaml']:
              with open(f, encoding='utf-8') as fh:
                  yaml.safe_load(fh)
              print(f, 'OK')
          "

  apparmor-compatibility:
    name: HAOS-compatible AppArmor syntax (3.x)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install and verify the legacy parser
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y apparmor
          apparmor_parser --version | grep 'version 3\.'
      - name: Parse original and Supervisor-renamed profiles
        run: |
          apparmor_parser -Q -K wayland-kiosk/apparmor.txt
          sed 's/^profile app_kiosk /profile b2ecadf4_app_kiosk /' wayland-kiosk/apparmor.txt > /tmp/kiosk-apparmor.txt
          apparmor_parser -Q -K /tmp/kiosk-apparmor.txt
          apparmor_parser -N /tmp/kiosk-apparmor.txt | grep -Fx b2ecadf4_app_kiosk
          apparmor_parser -N /tmp/kiosk-apparmor.txt | grep -Fx b2ecadf4_app_kiosk//browser

  image-build:
    name: App image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the app image
        run: docker build --tag local/app-kiosk:${{ github.sha }} wayland-kiosk
      - name: Verify actual Chromium Central Time and DST
        run: docker run --rm --security-opt seccomp=unconfined --entrypoint python3 -v "$PWD/tests:/app/tests:ro" local/app-kiosk:${{ github.sha }} /app/tests/browser_timezone_smoke.py
      - name: Verify browser security and trusted certificates
        run: docker run --rm --security-opt seccomp=unconfined --entrypoint python3 -v "$PWD/tests:/app/tests:ro" local/app-kiosk:${{ github.sha }} /app/tests/browser_security_smoke.py
      - name: Load enforced AppArmor profile
        run: |
          sed 's/^profile app_kiosk /profile b2ecadf4_app_kiosk /' wayland-kiosk/apparmor.txt > /tmp/kiosk-apparmor.txt
          sudo apparmor_parser -r /tmp/kiosk-apparmor.txt
          sudo aa-status
      - name: Verify device-directory discovery under AppArmor
        run: |
          mkdir -p "$RUNNER_TEMP/kiosk-devices/dri" "$RUNNER_TEMP/kiosk-devices/input/by-id" "$RUNNER_TEMP/kiosk-devices/input/by-path"
          docker run --rm --security-opt apparmor=b2ecadf4_app_kiosk --entrypoint /bin/sh -v "$RUNNER_TEMP/kiosk-devices/dri:/dev/dri:ro" -v "$RUNNER_TEMP/kiosk-devices/input:/dev/input:ro" local/app-kiosk:${{ github.sha }} -c 'ls -la /dev/dri && ls -la /dev/input && ls -la /dev/input/by-id'
      - name: Verify diagnostic listing failures are nonfatal
        run: docker run --rm --security-opt apparmor=b2ecadf4_app_kiosk --entrypoint python3 -v "$PWD/tests:/app/tests:ro" -v "$RUNNER_TEMP/kiosk-devices/dri:/dev/dri:ro" -v "$RUNNER_TEMP/kiosk-devices/input:/dev/input:ro" local/app-kiosk:${{ github.sha }} /app/tests/diagnostics_smoke.py
      - name: Verify real init and root setup under AppArmor
        run: |
          mkdir -p "$RUNNER_TEMP/kiosk-data"
          printf '%s' '{"ha_url":"http://192.0.2.1:8123","input_devices":[]}' > "$RUNNER_TEMP/kiosk-data/options.json"
          trap 'docker logs kiosk-init; docker rm -f kiosk-init >/dev/null' EXIT
          docker run -d --name kiosk-init --security-opt seccomp=unconfined --security-opt apparmor=b2ecadf4_app_kiosk -v "$RUNNER_TEMP/kiosk-data:/data" -v "$RUNNER_TEMP/kiosk-devices/dri:/dev/dri:ro" -v "$RUNNER_TEMP/kiosk-devices/input:/dev/input:ro" local/app-kiosk:${{ github.sha }}
          for attempt in $(seq 1 20); do
            if docker logs kiosk-init 2>&1 | grep -q "Rotation config"; then
              docker logs kiosk-init 2>&1 | grep -q "App internal IP address(es):"
              docker logs kiosk-init 2>&1 | grep -q "Trusted-network CIDR (direct HA route):"
              exit 0
            fi
            test "$(docker inspect -f '{{.State.Running}}' kiosk-init)" = true
            sleep 1
          done
          exit 1
      - name: Verify browser under enforced AppArmor
        run: docker run --rm --security-opt seccomp=unconfined --security-opt apparmor=b2ecadf4_app_kiosk --entrypoint python3 -v "$PWD/tests:/app/tests:ro" local/app-kiosk:${{ github.sha }} /app/tests/browser_security_smoke.py
      - name: Verify sustained rendering, audio and crash recovery under AppArmor
        run: docker run --rm --security-opt seccomp=unconfined --security-opt apparmor=b2ecadf4_app_kiosk --entrypoint python3 -v "$PWD/tests:/app/tests:ro" local/app-kiosk:${{ github.sha }} /app/tests/compositor_smoke.py
      - name: AppArmor denial diagnostics
        if: failure()
        run: sudo journalctl -k --since '20 minutes ago' --no-pager | grep -E 'apparmor|DENIED' || true
