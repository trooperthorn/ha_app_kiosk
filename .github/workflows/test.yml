# This repository ships an app with no automated pytest suite (no Python
# package, no frontend bundle). "Test" here means: source parses/lints
# cleanly, and the app image actually builds. release.yml calls this
# workflow so the same checks gate every GitHub Release.
name: Test

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: Syntax and lint (Python 3.14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Compile Python
        run: python -m py_compile wayland-kiosk/rest_server.py
      - name: Shell syntax check
        run: |
          bash -n wayland-kiosk/run.sh
          bash -n wayland-kiosk/launch-browser.sh
      - name: Validate YAML
        run: |
          pip install pyyaml
          python -c "
          import yaml
          for f in ['wayland-kiosk/config.yaml', 'repository.yaml', 'display-kiosk.yaml']:
              with open(f, encoding='utf-8') as fh:
                  yaml.safe_load(fh)
              print(f, 'OK')
          "

  image-build:
    name: App image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the app image
        run: docker build --tag local/app-kiosk:${{ github.sha }} wayland-kiosk
