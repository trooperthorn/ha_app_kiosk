# Syntax, lint, and image build gate; release.yml calls it so the same checks gate every release.
name: Test

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: Syntax and lint (Python 3.14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Compile Python
        run: python -m compileall -q wayland-kiosk
      - name: Install test dependencies
        run: pip install aiohttp==3.14.3
      - name: Security and time zone regression tests
        run: python -m unittest discover -s tests -v
      - name: Shell syntax check
        run: |
          bash -n wayland-kiosk/run.sh
          bash -n wayland-kiosk/launch-browser.sh
      - name: Validate YAML
        run: |
          pip install pyyaml
          python -c "
          import yaml
          for f in ['wayland-kiosk/config.yaml', 'repository.yaml', 'display-kiosk.yaml']:
              with open(f, encoding='utf-8') as fh:
                  yaml.safe_load(fh)
              print(f, 'OK')
          "

  image-build:
    name: App image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the app image
        run: docker build --tag local/app-kiosk:${{ github.sha }} wayland-kiosk
      - name: Verify actual Chromium Central Time and DST
        run: docker run --rm --security-opt seccomp=unconfined --entrypoint python3 -v "$PWD/tests:/app/tests:ro" local/app-kiosk:${{ github.sha }} /app/tests/browser_timezone_smoke.py
      - name: Verify browser security and trusted certificates
        run: docker run --rm --security-opt seccomp=unconfined --entrypoint python3 -v "$PWD/tests:/app/tests:ro" local/app-kiosk:${{ github.sha }} /app/tests/browser_security_smoke.py
      - name: Load enforced AppArmor profile
        run: |
          sudo apparmor_parser -r wayland-kiosk/apparmor.txt
          sudo aa-status
      - name: Verify browser under enforced AppArmor
        run: docker run --rm --security-opt seccomp=unconfined --security-opt apparmor=app_kiosk --entrypoint python3 -v "$PWD/tests:/app/tests:ro" local/app-kiosk:${{ github.sha }} /app/tests/browser_security_smoke.py
      - name: AppArmor denial diagnostics
        if: failure()
        run: sudo journalctl -k --since '20 minutes ago' --no-pager | grep -E 'apparmor|DENIED' || true
